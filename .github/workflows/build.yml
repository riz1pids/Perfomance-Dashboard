name: Build and publish dashboard

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Pages. Untick for a dry run: download from Drive and build, publish nothing."
        type: boolean
        default: true
  # Rebuild every morning at 09:00 Dhaka (03:00 UTC). Uncomment once a manual
  # run has published cleanly.
  # schedule:
  #   - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

env:
  # The shared Drive folder holding this month's input files. To point at a
  # different folder, set a repository variable DRIVE_FOLDER_ID
  # (Settings > Secrets and variables > Actions > Variables).
  DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID || '1jVPttn8PH6F5vZr09oKedXOXcxarxemT' }}
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Download the input folder from Google Drive
        run: |
          gdown --folder --retries 3 --timeout 300 \
            "https://drive.google.com/drive/folders/${DRIVE_FOLDER_ID}" -O input/
          echo "Downloaded:"
          find input -type f -printf '  %P  (%s bytes)\n' | sort

      - name: Bring in the months already published
        run: python ci/fetch_published.py "$SITE_URL" _site/data

      - name: Build this month
        env:
          SHWAPNO_INPUT_DIR: input
          SHWAPNO_OUTPUT_DIR: _site/data
          # Logs on a public repository are public: mask crore figures.
          SHWAPNO_REDACT_LOG: "1"
        run: python build_dashboard_data.py

      - name: Assemble the site
        run: |
          cp index.html _site/
          touch _site/.nojekyll
          du -sh _site
          find _site -type f -printf '  %P  (%s bytes)\n' | sort

      - name: Upload the site
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    if: ${{ github.event_name == 'schedule' || inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
